name: emailsendingproject

services:
  app:
    container_name: emailsendingproject-app
    build:
      context: .
      target: development
    command: npm run dev -- --hostname 0.0.0.0
    env_file:
      - .env
    environment:
      DB_HOST: ${DB_SERVICE_HOST:-mysql}
      DB_PORT: 3306
      NODE_ENV: development
      WATCHPACK_POLLING: "true"
    ports:
      - "${APP_PORT:-43127}:3000"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    networks:
      - shared_services

networks:
  shared_services:
    name: shared_services
    external: true
